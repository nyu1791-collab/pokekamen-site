name: Update Pokekamen Live Status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pokekamen-live-status
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install curl_cffi
        run: pip install --quiet curl_cffi

      - name: Fetch latest status for all 4 platforms
        run: python scripts/update_status.py

      - name: Commit and push updated live-status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-status.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update live-status.json"
            git push
          fi
